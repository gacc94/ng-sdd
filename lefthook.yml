pre-commit:
  jobs:
    - name: Fix and stage files
      run: |
        # Get staged files (only .ts, .js, .json, .tsx, .jsx)
        STAGED_FILES=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(ts|js|json|tsx|jsx)$' || true)

        if [ -n "$STAGED_FILES" ]; then
          echo "Running biome check --write on staged files..."
          echo "$STAGED_FILES" | xargs bunx biome check --write
          echo "Re-staging fixed files..."
          echo "$STAGED_FILES" | xargs git add
        else
          echo "No staged files to check"
        fi

commit-msg:
  jobs:
    - name: Commitlint
      run: bunx commitlint --edit {1}